spring.application.name=Trading Bot By Mohammed

# Server
server.port=${SERVER_PORT:8080}

# PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# JPA - validate only; schema managed by Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT - secret MUST be at least 32 chars (set via env)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Encryption - secret MUST be at least 32 chars (set via env)
app.encryption.secret=${ENCRYPTION_SECRET}

# CORS - comma-separated origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Logging
logging.level.com.mod.trading=INFO
logging.pattern.level=%5p [%X{userId:-},%X{symbol:-}]

# ============================================================
# Resilience4j: Retry + Circuit Breaker for Alpaca calls
# ============================================================
resilience4j.retry.instances.alpaca.max-attempts=3
resilience4j.retry.instances.alpaca.wait-duration=1s
resilience4j.retry.instances.alpaca.exponential-backoff-multiplier=2
resilience4j.retry.instances.alpaca.retry-exceptions=java.io.IOException,java.net.http.HttpTimeoutException
# DO NOT retry business exceptions or 4xx Alpaca errors
resilience4j.retry.instances.alpaca.ignore-exceptions=\
  com.mod.trading.exception.InvalidTradeRequestException,\
  com.mod.trading.exception.TradingDisabledException,\
  com.mod.trading.exception.UserNotFoundException,\
  com.mod.trading.exception.AlpacaApiException

resilience4j.circuitbreaker.instances.alpaca.failure-rate-threshold=60
resilience4j.circuitbreaker.instances.alpaca.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.alpaca.sliding-window-size=10
resilience4j.circuitbreaker.instances.alpaca.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.alpaca.permitted-number-of-calls-in-half-open-state=2

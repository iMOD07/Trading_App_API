spring.application.name=Trading Bot - IBKR Edition

# Server
server.port=${SERVER_PORT:8080}

# PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Logging
logging.level.com.mod.trading=INFO
logging.level.com.ib=WARN
logging.pattern.level=%5p [%X{userId:-},%X{symbol:-}]

# ============================================================
# IBKR Connection
# ============================================================
# Default ports:
#   TWS Live:        7496
#   TWS Paper:       7497
#   IB Gateway Live: 4001
#   IB Gateway Paper: 4002
ibkr.host=${IBKR_HOST:127.0.0.1}
ibkr.port=${IBKR_PORT:4002}

# clientId must be unique per connection. If you run multiple bots,
# give each a different number 1-32.
ibkr.client-id=${IBKR_CLIENT_ID:1}

# Set to false in dev/test if IB Gateway isn't always running.
ibkr.connect-on-startup=${IBKR_CONNECT_ON_STARTUP:true}

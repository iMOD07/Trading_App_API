# Application
spring.application.name=Trading Bot Multi-User IBKR
server.port=${SERVER_PORT:8080}

# PostgreSQL (each value from environment)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/trading}
#spring.datasource.username=${DB_USER:postgres}
#spring.datasource.password=${DB_PASSWORD}
spring.datasource.username=${DB_USER:trading_user}
spring.datasource.password=${DB_PASSWORD:Mohammed@2301}

spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Flyway (managed schema)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT - REQUIRED
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://192.168.*}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# Logging
logging.level.com.mod.trading=INFO
logging.level.com.ib.client=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n
